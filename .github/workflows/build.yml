name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# Allow the workflow to create Releases and upload artifacts.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build. We capture the FULL gradle output to a log file (and stream it to
      # the console via tee) so a complete log is available even when the build
      # fails. If gradle fails, this step fails (job turns red) but the follow-up
      # report/log-upload steps run with `if: always()` so logs are never lost.
      - name: Build with Gradle
        id: gradle
        run: |
          mkdir -p build-logs
          ./gradlew build --no-daemon --console=plain 2>&1 | tee build-logs/build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      # Always generate a human-readable report in the job Summary so the result
      # (and the failure reason) is visible on the webpage without downloading.
      - name: Generate build report
        if: always()
        run: |
          {
            echo "## 📋 Build Report"
            echo ""
            echo "- **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **Ref:** \`${{ github.ref_name }}\`"
            if [ "${{ steps.gradle.outcome }}" = "success" ]; then
              echo "- **Status:** ✅ SUCCESS"
            else
              echo "- **Status:** ❌ FAILED (gradle exit ${BUILD_EXIT:-unknown})"
            fi
            echo ""
            echo "### Jar produced"
            if ls build/libs/*.jar 1>/dev/null 2>&1; then
              ls -la build/libs/*.jar | sed 's/^/- /'
            else
              echo "- _none_"
            fi
            echo ""
            echo "### Tail of build log (last 80 lines)"
            echo '```text'
            tail -n 80 build-logs/build.log 2>/dev/null || echo "(log missing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Always upload the COMPLETE build log as a downloadable artifact, so the
      # full error output is preserved for every run (success or failure).
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build-logs/
          if-no-files-found: warn
          retention-days: 30

      # Upload the jar only when the build actually succeeded.
      - name: Upload jar artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LinClient-jar
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

      # Create a GitHub Release with the jar attached — ONLY when a tag is pushed.
      # Plain pushes to main only build + report, never publish.
      - name: Create Release on tag
        if: steps.gradle.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      # Mirror the full build log to a standalone `ci-logs` branch so the log is
      # also retrievable via plain git (no API needed). Uses an orphan branch so
      # it never disturbs the build history. Non-fatal: if it fails for any
      # reason, the build result and the main log artifact are untouched.
      - name: Mirror log to ci-logs branch
        if: always()
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          mkdir -p /tmp/clog
          cp build-logs/build.log /tmp/clog/build.log 2>/dev/null || printf '(no log captured)\n' > /tmp/clog/build.log
          git branch -D ci-logs 2>/dev/null || true
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .[!.]* * 2>/dev/null || true
          cp /tmp/clog/build.log "./build-${GITHUB_RUN_ID}.log"
          git add -A
          git commit -m "build log | run ${GITHUB_RUN_ID} | ref ${GITHUB_REF_NAME} | outcome ${{ steps.gradle.outcome }}" || echo "nothing to commit"
          git push --force "https://x-access-token:${TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" HEAD:refs/heads/ci-logs
          git checkout -f "${GITHUB_SHA}" 2>/dev/null || true
