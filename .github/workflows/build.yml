name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# Allow the workflow to create Releases, upload artifacts, and push the ci-logs branch.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.12.2"
            dir: "1.12.2"
          - mc: "1.8.9"
            dir: "1.8.9"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build. We capture the FULL gradle output to a log file (and stream it to
      # the console via tee) so a complete log is available even when the build
      # fails. If gradle fails, this step fails (job turns red) but the follow-up
      # report/log-upload steps run with `if: always()` so logs are never lost.
      # Each version uses its own Gradle Wrapper (Gradle 4.9 for 1.12.2,
      # Gradle 2.14.1 for 1.8.9) pinned via ForgeGradle 2.x.
      - name: Build with Gradle
        id: gradle
        run: |
          mkdir -p /tmp/linclient-logs
          ./gradlew build --no-daemon --console=plain 2>&1 | tee "/tmp/linclient-logs/build-${{ matrix.mc }}.log"
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      # Always generate a human-readable report in the job Summary so the result
      # (and the failure reason) is visible on the webpage without downloading.
      - name: Generate build report
        if: always()
        run: |
          {
            echo "## 📋 Build Report — MC ${{ matrix.mc }}"
            echo ""
            echo "- **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **Ref:** \`${{ github.ref_name }}\`"
            if [ "${{ steps.gradle.outcome }}" = "success" ]; then
              echo "- **Status:** ✅ SUCCESS"
            else
              echo "- **Status:** ❌ FAILED (gradle exit ${BUILD_EXIT:-unknown})"
            fi
            echo ""
            echo "### Jar produced"
            if ls build/libs/*.jar 1>/dev/null 2>&1; then
              ls -la build/libs/*.jar | sed 's/^/- /'
            else
              echo "- _none_"
            fi
            echo ""
            echo "### Tail of build log (last 80 lines)"
            echo '```text'
            tail -n 80 "/tmp/linclient-logs/build-${{ matrix.mc }}.log" 2>/dev/null || echo "(log missing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Always upload the COMPLETE build log as a downloadable artifact, so the
      # full error output is preserved for every run (success or failure).
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.mc }}
          path: /tmp/linclient-logs/build-${{ matrix.mc }}.log
          if-no-files-found: warn
          retention-days: 30

      # Upload the jar only when the build actually succeeded.
      - name: Upload jar artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LinClient-${{ matrix.mc }}-jar
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

  # Mirror BOTH build logs to a standalone `ci-logs` branch so the logs are also
  # retrievable via plain git (no API needed). Runs after all builds (so parallel
  # pushes from the two matrix jobs don't clobber each other) and is non-fatal:
  # if it fails for any reason, the artifacts above already hold the logs.
  ci-logs:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download build logs
        uses: actions/download-artifact@v4
        with:
          pattern: build-log-*
          path: /tmp/ci-logs-artifacts
          merge-multiple: true

      - name: Mirror logs to ci-logs branch
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          rm -rf /tmp/clogrepo
          git clone --quiet "https://x-access-token:${TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" /tmp/clogrepo
          cd /tmp/clogrepo
          git checkout ci-logs 2>/dev/null || git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fd >/dev/null 2>&1 || true
          rm -f /tmp/clogrepo/*.log
          cp /tmp/ci-logs-artifacts/*.log ./ 2>/dev/null || printf '(no logs captured)\n' > "build-${GITHUB_RUN_ID}-empty.log"
          git add -A
          git commit -m "build logs | run ${GITHUB_RUN_ID} | ref ${GITHUB_REF_NAME} | outcome ${{ needs.build.result }}" || echo "nothing to commit"
          git push --force "https://x-access-token:${TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" HEAD:refs/heads/ci-logs

  # Create a GitHub Release with BOTH jars attached — ONLY when a tag is pushed.
  # Plain pushes to main only build + report, never publish.
  release:
    needs: build
    if: needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download both jar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LinClient-*-jar
          path: /tmp/release-jars
          merge-multiple: true

      - name: Create Release on tag
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-jars/*.jar
          generate_release_notes: true
