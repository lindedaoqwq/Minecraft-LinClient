buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://bmclapi2.bangbang93.com/maven" }
        maven { url = "https://repo.maven.apache.org/maven2" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
    }
    // Forge's buildscript SNAPSHOTs have been frozen in time for years. Re-validating
    // them against the maven on every CI run only invites transient download failures
    // ("Premature end of Content-Length delimited message body"), so pin them for a year.
    configurations.classpath {
        resolutionStrategy.cacheChangingModulesFor 365, 'days'
        resolutionStrategy.cacheDynamicVersionsFor 365, 'days'
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "1.0.0"
group = "com.lindedaoqwq"
archivesBaseName = "LinClient-1.12.2"

sourceCompatibility = targetCompatibility = "1.8"

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
    makeObfSourceJar = false
}

repositories {
    maven { url = "https://repo.maven.apache.org/maven2" }
    maven { url = "https://bmclapi2.bangbang93.com/maven" }
}

dependencies {
    // Only Forge is required; no extra libraries.
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand version: project.version, mcversion: project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

jar {
    manifest {
        attributes 'FMLCorePlugin': 'com.lindedaoqwq.linclient.core.LinClientCorePlugin',
                   'FMLCorePluginContainsFMLMod': 'true'
    }
}
